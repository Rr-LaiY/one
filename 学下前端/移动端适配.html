<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端适配</title>
    <style>
        .boxt_px {
            width: 400px;
            height: 100px;
            background-color: rgb(68, 215, 241);
        }
        .boxt_rem {
            width: 37.5rem;
            height: 6.25rem;
            background-color: pink;
        }
        .boxt_vw {
            width: 60vw;
            height: 10vh;
            background-color: white;
        }
        .boxt_vh {
            width: 60vw;
            height: 10vh;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="boxt_px"></div>
    <div class="boxt_rem"></div>
    <div class="boxt_vw"></div>
    <div class="boxt_vh"></div>

    
</body>
</html>
