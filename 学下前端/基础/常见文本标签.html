<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本标签 练习</title>
    <style>
        .profile{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>一级标题</h1>
    <div class="card">
        <img src="F_LaiY.png" class="profile">
        <h1>Rr_LaiY</h1>
        <p>简介</p>
    <p>看看文本样式：<b>粗体</b><i>斜体</i><u>下划线</u><s>删除线</s></p>
    <ul>
        <li><b>无序列表项 1</b></li>
        <li><i>无序列表项 2</i></li>
        <li><u>无序列表项 3</u></li>
        <li><s>无序列表项 4</s></li>
    </ul>
    <ol>
        <li><b>有序列表项 1</b></li>
        <li><i>有序列表项 2</i></li>
        <li><u>有序列表项 3</u></li>
        <li><s>有序列表项 4</s></li>
    </ol>
    <table border="1">
        <tr>
            <th>表头 1</th>
            <th>表头 2</th>
            <th>表头 3</th>
        </tr>
        <tr>
            <td>单元格 11</td>
            <td>单元格 12</td>
            <td>单元格 13</td>
        </tr>
        <tr>
            <td>单元格 21</td>
            <td>单元格 22</td>
            <td>单元格 23</td>
        </tr>
        <tr>
            <td>单元格 31</td>
            <td>单元格 32</td>
            <td>单元格 33</td>
        </tr>
    </table>



    </div>

    
</body>
</html>
