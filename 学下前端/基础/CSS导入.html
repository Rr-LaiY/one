<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS导入</title>
    <link rel="stylesheet" href="CSS样式1.css">
    <style>
        p {
            color: rgb(156, 63, 233);
            font-style: 24px;
        }
        body {
            background-color: #26b9cc;
        }
        h2 {
            color: rgb(200, 221, 108);
            font-size: 30px;
        }
    </style>
</head>
<body>
    <p>此段使用CSS样式</p>
    <h1 style="color: rgb(253, 76, 76); font-size: 36px;">一级标题，使用内联CSS</h1>
    <h2>二级标题，使用内部CSS</h2>
    <h3>三级，使用外部</h3>
</body>
</html>
