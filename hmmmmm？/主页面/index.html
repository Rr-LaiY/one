<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 字符编码设置为UTF-8，支持中文 -->
    <meta charset="UTF-8">
    <!-- 响应式设计：视口宽度等于设备宽度，初始缩放比例为1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面标题 -->
    <title>我去！这是我的网站O.o</title>
    <style>
        /* ========== 全局样式重置 ========== */
        /* 清除所有元素的默认边距和内边距，统一盒模型 */
        * {
            margin: 0;              /* 清除外边距 */
            padding: 0;             /* 清除内边距 */
            box-sizing: border-box; /* 边框盒模型：宽高包含padding和border */
        }

        /* ========== HTML和Body基础设置 ========== */
        /* 让页面占满整个视口，隐藏滚动条 */
        html, body {
            width: 100%;            /* 宽度100% */
            height: 100%;           /* 高度100% */
            overflow: hidden;       /* 隐藏溢出内容（无滚动条） */
        }

        /* ========== Body主体样式 ========== */
        /* 黑色背景，作为所有元素的定位参考 */
        body {
            background-color: #000; /* 纯黑背景 */
            position: relative;     /* 相对定位，为子元素提供定位上下文 */
        }

        /* ========== 网格背景装饰 ========== */
        /* 使用伪元素创建科幻风格的网格背景 */
        body::before {
            content: '';                /* 创建伪元素 */
            position: fixed;            /* 固定定位，不随页面滚动 */
            inset: 0;                   /* 简写：top:0; right:0; bottom:0; left:0; */
            pointer-events: none;       /* 不响应鼠标事件，不影响下层元素交互 */
            background-image:           /* 使用渐变创建网格线 */
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),      /* 水平线 */
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); /* 垂直线 */
            background-size: 50px 50px; /* 网格大小：50x50像素 */
        }

        /* ========== HUD装饰容器 ========== */
        /* 固定在屏幕上的科幻HUD界面装饰层 */
        .hud-decorations {
            position: fixed;            /* 固定定位 */
            inset: 0;                   /* 占满整个视口 */
            pointer-events: none;       /* 不响应鼠标事件 */
        }

        /* ========== HUD角落框架 - 基础样式 ========== */
        /* 四个角落的HUD框架共用样式 */
        .hud-corner {
            position: absolute;         /* 绝对定位 */
            width: 150px;               /* 宽度150像素 */
            height: 150px;              /* 高度150像素 */
        }

        /* HUD角落框架的文字标签（使用before伪元素） */
        .hud-corner::before {
            position: absolute;                         /* 绝对定位 */
            font-size: 9px;                             /* 小字体 */
            color: rgba(255, 255, 255, 0.4);            /* 半透明白色 */
            font-family: 'Courier New', monospace;      /* 等宽字体，科技感 */
            letter-spacing: 1px;                        /* 字符间距 */
        }

        /* HUD角落框架的装饰线（使用after伪元素） */
        .hud-corner::after {
            content: '';                                /* 创建伪元素 */
            position: absolute;                         /* 绝对定位 */
            width: 30px;                                /* 宽度30像素 */
            height: 1px;                                /* 高度1像素（细线） */
            background: rgba(0, 255, 255, 0.5);         /* 半透明青色 */
        }

        /* ========== 左上角HUD框架 ========== */
        .hud-corner-tl {
            top: 20px;                                      /* 距顶部20像素 */
            left: 20px;                                     /* 距左侧20像素 */
            border-left: 1px solid rgba(255, 255, 255, 0.3);  /* 左边框 */
            border-top: 1px solid rgba(255, 255, 255, 0.3);   /* 上边框 */
        }

        .hud-corner-tl::before {
            content: 'SYS_01';          /* 显示文字"SYS_01" */
            top: -15px;                 /* 位于框架上方 */
            left: 0;                    /* 左对齐 */
        }

        .hud-corner-tl::after {
            top: 0;                     /* 位于顶部 */
            left: 0;                    /* 位于左侧 */
        }

        /* ========== 右上角HUD框架 ========== */
        .hud-corner-tr {
            top: 20px;                                      /* 距顶部20像素 */
            right: 20px;                                    /* 距右侧20像素 */
            border-right: 1px solid rgba(255, 255, 255, 0.3); /* 右边框 */
            border-top: 1px solid rgba(255, 255, 255, 0.3);   /* 上边框 */
        }

        .hud-corner-tr::before {
            content: 'NET_LINK';        /* 显示文字"NET_LINK" */
            top: -15px;                 /* 位于框架上方 */
            right: 0;                   /* 右对齐 */
        }

        .hud-corner-tr::after {
            top: 0;                     /* 位于顶部 */
            right: 0;                   /* 位于右侧 */
        }

        /* ========== 左下角HUD框架 ========== */
        .hud-corner-bl {
            bottom: 20px;                                   /* 距底部20像素 */
            left: 20px;                                     /* 距左侧20像素 */
            border-left: 1px solid rgba(255, 255, 255, 0.3);  /* 左边框 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); /* 下边框 */
        }

        .hud-corner-bl::before {
            content: 'DATA_STREAM';     /* 显示文字"DATA_STREAM" */
            bottom: -15px;              /* 位于框架下方 */
            left: 0;                    /* 左对齐 */
        }

        .hud-corner-bl::after {
            bottom: 0;                  /* 位于底部 */
            left: 0;                    /* 位于左侧 */
        }

        /* ========== 右下角HUD框架 ========== */
        .hud-corner-br {
            bottom: 20px;                                   /* 距底部20像素 */
            right: 20px;                                    /* 距右侧20像素 */
            border-right: 1px solid rgba(255, 255, 255, 0.3); /* 右边框 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.3); /* 下边框 */
        }

        .hud-corner-br::before {
            content: 'TERMINAL_02';     /* 显示文字"TERMINAL_02" */
            bottom: -15px;              /* 位于框架下方 */
            right: 0;                   /* 右对齐 */
        }

        .hud-corner-br::after {
            bottom: 0;                  /* 位于底部 */
            right: 0;                   /* 位于右侧 */
        }

        /* ========== 电路连接线装饰 ========== */
        /* 水平电路线基础样式，带渐变效果 */
        .circuit-line {
            position: absolute;                 /* 绝对定位 */
            top: 50%;                           /* 垂直居中 */
            width: 200px;                       /* 宽度200像素 */
            height: 1px;                        /* 高度1像素（细线） */
            background: linear-gradient(90deg,  /* 水平渐变 */
                rgba(255, 255, 255, 0.2) 0%,    /* 两端较暗 */
                rgba(0, 255, 255, 0.3) 50%,     /* 中间青色较亮 */
                rgba(255, 255, 255, 0.2) 100%); /* 两端较暗 */
        }

        /* 电路线上的发光节点 */
        .circuit-line::before {
            content: '';                            /* 创建伪元素 */
            position: absolute;                     /* 绝对定位 */
            top: -2px;                              /* 向上偏移，居中对齐线条 */
            width: 5px;                             /* 宽度5像素 */
            height: 5px;                            /* 高度5像素 */
            background: rgba(0, 255, 255, 0.6);     /* 青色背景 */
            border-radius: 50%;                     /* 圆形 */
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.8); /* 发光效果 */
        }

        /* 左侧电路线 */
        .circuit-line-1 {
            left: 170px;                /* 距左侧170像素 */
        }

        .circuit-line-1::before {
            left: 50%;                  /* 节点位于线条中间 */
        }

        /* 右侧电路线 */
        .circuit-line-2 {
            right: 170px;               /* 距右侧170像素 */
        }

        .circuit-line-2::before {
            right: 50%;                 /* 节点位于线条中间 */
        }

        /* ========== 技术标签 ========== */
        /* 页面中央上方的状态标签 */
        .tech-label {
            position: absolute;                         /* 绝对定位 */
            top: 50%;                                   /* 垂直50%位置 */
            left: 50%;                                  /* 水平50%位置 */
            transform: translate(-50%, -200px);         /* 居中并向上偏移200px */
            font-size: 8px;                             /* 小字体 */
            color: rgba(255, 255, 255, 0.3);            /* 半透明白色 */
            font-family: 'Courier New', monospace;      /* 等宽字体 */
            letter-spacing: 2px;                        /* 字符间距 */
            border: 1px solid rgba(255, 255, 255, 0.2); /* 边框 */
            padding: 3px 8px;                           /* 内边距 */
            background: rgba(0, 0, 0, 0.5);             /* 半透明黑色背景 */
        }

        /* 技术标签下方的连接线 */
        .tech-label::before {
            content: '';                                /* 创建伪元素 */
            position: absolute;                         /* 绝对定位 */
            left: 50%;                                  /* 水平居中 */
            bottom: -20px;                              /* 位于标签下方 */
            width: 1px;                                 /* 宽度1像素 */
            height: 20px;                               /* 高度20像素 */
            background: rgba(255, 255, 255, 0.2);       /* 半透明白色 */
        }

        /* ========== UI装饰框架 ========== */
        /* UI框架基础样式 */
        .ui-frame {
            position: absolute;                         /* 绝对定位 */
            border: 1px solid rgba(255, 255, 255, 0.15); /* 半透明边框 */
        }

        /* 左侧UI框架 */
        .ui-frame-1 {
            top: 35%;                   /* 距顶部35% */
            left: 10%;                  /* 距左侧10% */
            width: 80px;                /* 宽度80像素 */
            height: 60px;               /* 高度60像素 */
        }

        /* 左侧UI框架的左上角装饰 */
        .ui-frame-1::before {
            content: '';                                    /* 创建伪元素 */
            position: absolute;                             /* 绝对定位 */
            top: -1px;                                      /* 位于顶部 */
            left: -1px;                                     /* 位于左侧 */
            width: 15px;                                    /* 宽度15像素 */
            height: 15px;                                   /* 高度15像素 */
            border-left: 1px solid rgba(0, 255, 255, 0.4);  /* 左边框 */
            border-top: 1px solid rgba(0, 255, 255, 0.4);   /* 上边框 */
        }

        /* 右侧UI框架 */
        .ui-frame-2 {
            top: 60%;                   /* 距顶部60% */
            right: 15%;                 /* 距右侧15% */
            width: 100px;               /* 宽度100像素 */
            height: 70px;               /* 高度70像素 */
        }

        /* 右侧UI框架的右下角装饰 */
        .ui-frame-2::after {
            content: '';                                    /* 创建伪元素 */
            position: absolute;                             /* 绝对定位 */
            bottom: -1px;                                   /* 位于底部 */
            right: -1px;                                    /* 位于右侧 */
            width: 15px;                                    /* 宽度15像素 */
            height: 15px;                                   /* 高度15像素 */
            border-right: 1px solid rgba(0, 255, 255, 0.4); /* 右边框 */
            border-bottom: 1px solid rgba(0, 255, 255, 0.4); /* 下边框 */
        }

        /* ========== 主容器 ========== */
        /* 页面主要内容容器，使用弹性布局 */
        .container {
            display: flex;                  /* 弹性布局 */
            justify-content: space-between; /* 两端对齐 */
            align-items: flex-start;        /* 顶部对齐 */
            padding: 40px;                  /* 内边距40像素 */
            position: relative;             /* 相对定位 */
            z-index: 1;                     /* 层级1，在背景装饰上方 */
            font-family: Arial, sans-serif; /* 字体 */
            width: 100%;                    /* 宽度100% */
            height: 100%;                   /* 高度100% */
        }

        /* ========== 竖直分割线 ========== */
        /* 分隔左右区域的垂直线 */
        .divider-line {
            position: absolute;                         /* 绝对定位 */
            top: 0;                                     /* 从顶部开始 */
            width: 2px;                                 /* 宽度2像素 */
            height: 100%;                               /* 高度100% */
            background-color: rgba(170, 170, 170, 0.911); /* 灰色半透明 */
        }

        /* ========== 左侧大方框装饰 ========== */
        /* 固定在左侧的科幻风格装饰面板 */
        .left-panel {
            position: fixed;                            /* 固定定位 */
            left: 40px;                                 /* 距左侧40像素 */
            top: 50%;                                   /* 垂直50%位置 */
            transform: translateY(-50%);                /* 垂直居中 */
            width: 350px;                               /* 宽度350像素 */
            height: 500px;                              /* 高度500像素 */
            border: 1px solid rgba(255, 255, 255, 0.3); /* 边框 */
            background: rgba(0, 0, 0, 0.3);             /* 半透明黑色背景 */
            backdrop-filter: blur(5px);                 /* 背景模糊效果 */
            z-index: 0;                                 /* 层级0，在内容下方 */
            pointer-events: none;                       /* 不响应鼠标事件 */
        }

        /* 左侧面板的标题标签 */
        .left-panel::before {
            content: 'SYSTEM_PANEL';                    /* 显示文字 */
            position: absolute;                         /* 绝对定位 */
            top: -12px;                                 /* 位于面板上方 */
            left: 15px;                                 /* 距左侧15像素 */
            font-size: 10px;                            /* 字体大小 */
            color: rgba(255, 255, 255, 0.5);            /* 半透明白色 */
            font-family: 'Courier New', monospace;      /* 等宽字体 */
            letter-spacing: 2px;                        /* 字符间距 */
            background: #000;                           /* 黑色背景 */
            padding: 2px 8px;                           /* 内边距 */
        }

        /* 左侧面板的左上角装饰 */
        .left-panel::after {
            content: '';                                    /* 创建伪元素 */
            position: absolute;                             /* 绝对定位 */
            top: -1px;                                      /* 位于顶部 */
            left: -1px;                                     /* 位于左侧 */
            width: 25px;                                    /* 宽度25像素 */
            height: 25px;                                   /* 高度25像素 */
            border-left: 2px solid rgba(0, 255, 255, 0.6);  /* 左边框 */
            border-top: 2px solid rgba(0, 255, 255, 0.6);   /* 上边框 */
        }

        /* 左侧面板的右下角装饰 */
        .left-panel-corner-br {
            position: absolute;                             /* 绝对定位 */
            bottom: -1px;                                   /* 位于底部 */
            right: -1px;                                    /* 位于右侧 */
            width: 25px;                                    /* 宽度25像素 */
            height: 25px;                                   /* 高度25像素 */
            border-right: 2px solid rgba(0, 255, 255, 0.6); /* 右边框 */
            border-bottom: 2px solid rgba(0, 255, 255, 0.6); /* 下边框 */
        }

        /* 左侧面板内的装饰线条基础样式 */
        .left-panel-line {
            position: absolute;                         /* 绝对定位 */
            background: rgba(255, 255, 255, 0.15);      /* 半透明白色 */
        }

        /* 上方水平线 */
        .left-panel-line-h1 {
            top: 60px;                  /* 距顶部60像素 */
            left: 20px;                 /* 距左侧20像素 */
            right: 20px;                /* 距右侧20像素 */
            height: 1px;                /* 高度1像素 */
        }

        /* 下方水平线 */
        .left-panel-line-h2 {
            bottom: 60px;               /* 距底部60像素 */
            left: 20px;                 /* 距左侧20像素 */
            right: 20px;                /* 距右侧20像素 */
            height: 1px;                /* 高度1像素 */
        }

        /* 中间垂直线 */
        .left-panel-line-v1 {
            top: 80px;                  /* 距顶部80像素 */
            bottom: 80px;               /* 距底部80像素 */
            left: 50%;                  /* 水平居中 */
            width: 1px;                 /* 宽度1像素 */
        }

        /* 左侧面板内的发光装饰点基础样式 */
        .left-panel-dot {
            position: absolute;                         /* 绝对定位 */
            width: 4px;                                 /* 宽度4像素 */
            height: 4px;                                /* 高度4像素 */
            background: rgba(0, 255, 255, 0.7);         /* 青色背景 */
            border-radius: 50%;                         /* 圆形 */
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.8); /* 发光效果 */
        }

        /* 上方装饰点 */
        .left-panel-dot-1 {
            top: 60px;                              /* 距顶部60像素 */
            left: 50%;                              /* 水平居中 */
            transform: translate(-50%, -50%);       /* 精确居中 */
        }

        /* 下方装饰点 */
        .left-panel-dot-2 {
            bottom: 60px;                           /* 距底部60像素 */
            left: 50%;                              /* 水平居中 */
            transform: translate(-50%, 50%);        /* 精确居中 */
        }

        /* ========== 左侧内容区域 ========== */
        /* 包含个人信息的左侧区域 */
        .left-section {
            display: flex;                  /* 弹性布局 */
            flex-direction: column;         /* 纵向排列 */
            gap: 20px;                      /* 子元素间距20像素 */
            transition: transform 0.3s ease; /* 过渡动画 */
            position: relative;             /* 相对定位 */
            z-index: 2;                     /* 层级2，在装饰面板上方 */
        }

        /* 响应式：中等屏幕 */
        @media (max-width: 900px) {
            .left-section {
                transform: translateX(-20px); /* 向左移动20像素 */
            }
            .left-panel {
                display: none;              /* 隐藏装饰面板 */
            }
        }

        /* ========== 右侧内容区域 ========== */
        /* 包含标题的右侧区域 */
        .right-section {
            display: flex;                  /* 弹性布局 */
            flex-direction: column;         /* 纵向排列 */
            align-items: flex-end;          /* 右对齐 */
        }

        /* ========== 主标题样式 ========== */
        /* 右侧的主标题，带虚线边框和角落装饰 */
        h1 {
            color: #0fe0d6;                 /* 青色文字 */
            font-size: 28px;                /* 字体大小 */
            margin-bottom: 30px;            /* 下边距 */
            padding: 20px 90px 20px 30px;   /* 内边距：上右下左 */
            border: 1px solid;              /* 1像素边框 */
            border-image: linear-gradient(90deg,  /* 虚线边框效果（使用渐变） */
                rgba(255, 255, 255, 0.3) 0%,      /* 实线段 */
                rgba(255, 255, 255, 0.3) 25%,
                transparent 25%,                   /* 透明段（间隙） */
                transparent 30%,
                rgba(255, 255, 255, 0.3) 30%,      /* 实线段 */
                rgba(255, 255, 255, 0.3) 70%,
                transparent 70%,                   /* 透明段 */
                transparent 75%,
                rgba(255, 255, 255, 0.3) 75%,      /* 实线段 */
                rgba(255, 255, 255, 0.3) 100%) 1;
            position: relative;             /* 相对定位，为伪元素提供定位上下文 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* 文字阴影 */
            transition: all 0.3s ease;      /* 过渡动画 */
            white-space: nowrap;            /* 文字不换行 */
        }

        /* 标题左上角装饰 */
        h1::before {
            content: '';                                    /* 创建伪元素 */
            position: absolute;                             /* 绝对定位 */
            top: -1px;                                      /* 位于顶部 */
            left: -1px;                                     /* 位于左侧 */
            width: 20px;                                    /* 宽度20像素 */
            height: 20px;                                   /* 高度20像素 */
            border-left: 1px solid rgba(0, 255, 255, 0.6);  /* 左边框 */
            border-top: 1px solid rgba(0, 255, 255, 0.6);   /* 上边框 */
        }

        /* 标题右下角装饰 */
        h1::after {
            content: '';                                    /* 创建伪元素 */
            position: absolute;                             /* 绝对定位 */
            bottom: -1px;                                   /* 位于底部 */
            right: -1px;                                    /* 位于右侧 */
            width: 20px;                                    /* 宽度20像素 */
            height: 20px;                                   /* 高度20像素 */
            border-right: 1px solid rgba(0, 255, 255, 0.6); /* 右边框 */
            border-bottom: 1px solid rgba(0, 255, 255, 0.6); /* 下边框 */
        }

        /* 标题悬停效果 */
        h1:hover {
            border-image: linear-gradient(90deg,  /* 悬停时边框变为青色 */
                rgba(0, 255, 255, 0.25) 0%,
                rgba(0, 255, 255, 0.25) 25%,
                transparent 25%,
                transparent 30%,
                rgba(0, 255, 255, 0.25) 30%,
                rgba(0, 255, 255, 0.25) 70%,
                transparent 70%,
                transparent 75%,
                rgba(0, 255, 255, 0.25) 75%,
                rgba(0, 255, 255, 0.25) 100%) 1;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.05); /* 微弱发光效果 */
        }

        /* ========== 个人信息区域 ========== */
        /* 个人信息容器：包含头像和文字 */
        .profile {
            display: flex;              /* 弹性布局 */
            align-items: center;        /* 垂直居中对齐 */
            gap: 15px;                  /* 子元素间距15像素 */
        }

        /* 头像包装器 */
        .profile-img-wrapper {
            position: relative;         /* 相对定位，为SVG装饰提供定位上下文 */
            width: 100px;               /* 宽度100像素 */
            height: 100px;              /* 高度100像素 */
        }

        /* 头像图片 */
        .profile img {
            width: 100px;               /* 宽度100像素 */
            height: 100px;              /* 高度100像素 */
            object-fit: contain;        /* 保持图片比例 */
            filter: drop-shadow(4px 4px 8px rgba(0, 0, 0, 0.4)); /* 投影效果 */
            transition: all 0.3s ease;  /* 过渡动画 */
        }

        /* ========== 头像角落装饰线 ========== */
        /* SVG折线装饰基础样式 */
        .corner-line {
            position: absolute;         /* 绝对定位 */
            width: 120px;               /* 宽度120像素 */
            height: 120px;              /* 高度120像素 */
            pointer-events: none;       /* 不响应鼠标事件 */
            z-index: 10;                /* 层级10，在头像上方 */
        }

        /* 左上角折线 */
        .corner-line-tl {
            top: -10px;                 /* 向上偏移10像素 */
            left: -10px;                /* 向左偏移10像素 */
        }

        /* 右下角折线 */
        .corner-line-br {
            bottom: -10px;              /* 向下偏移10像素 */
            right: -10px;               /* 向右偏移10像素 */
        }

        /* ========== 个人信息文字区域 ========== */
        /* 文字容器 */
        .profile-text {
            color: rgb(2, 154, 255);            /* 蓝色文字 */
            font-size: 32px;                    /* 字体大小 */
            font-weight: bold;                  /* 粗体 */
            letter-spacing: 3px;                /* 字符间距 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* 文字阴影 */
            display: flex;                      /* 弹性布局 */
            flex-direction: column;             /* 纵向排列 */
            gap: 5px;                           /* 子元素间距5像素 */
        }

        /* 名字容器 */
        .profile-name {
            display: inline-block;      /* 行内块元素 */
        }

        /* 名字中的每个字符（由JS动态生成） */
        .profile-name span {
            display: inline-block;      /* 行内块元素，支持transform */
            transition: all 0.3s ease;  /* 过渡动画 */
            cursor: default;            /* 默认光标 */
        }

        /* 单个字符悬停效果 */
        .profile-name span:hover {
            color: rgb(0, 166, 226);                        /* 颜色变化 */
            transform: translateY(-1px);                    /* 向上移动1像素 */
            text-shadow: 2px 2px 6px rgba(50, 200, 255, 0.6); /* 增强阴影 */
        }

        /* 名字下方的装饰线 */
        .profile-name::after {
            content: '';                        /* 创建伪元素 */
            display: block;                     /* 块级元素 */
            width: 100%;                        /* 宽度100% */
            height: 1px;                        /* 高度1像素 */
            background-color: rgb(201, 92, 252); /* 紫色 */
            margin-top: 3px;                    /* 上边距3像素 */
        }

        /* 个人描述文字 */
        .profile-desc {
            font-size: 12px;                            /* 小字体 */
            color: #5c14e4;                             /* 紫色 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* 文字阴影 */
            letter-spacing: normal;                     /* 正常字符间距 */
            font-weight: normal;                        /* 正常字重 */
            transition: all 0.3s ease;                  /* 过渡动画 */
        }

        /* 描述文字悬停效果 */
        .profile-desc:hover {
            color: #7a3aff;             /* 颜色变亮 */
        }

        /* ========== 字符切换效果 ========== */
        /* "你"/"我"字符切换容器 */
        .char-switch {
            position: relative;         /* 相对定位，为绝对定位的"我"字提供上下文 */
            display: inline;            /* 行内元素 */
        }

        /* "你"和"我"字符的共同样式 */
        .char-you,
        .char-me {
            color: #fa2b70;             /* 粉红色 */
            font-size: inherit;         /* 继承父元素字体大小 */
            line-height: inherit;       /* 继承行高 */
            font-weight: inherit;       /* 继承字重 */
        }

        /* "你"字：默认显示 */
        .char-you {
            display: inline;            /* 行内元素 */
        }

        /* "我"字：叠加在"你"字上方 */
        .char-me {
            position: absolute;         /* 绝对定位 */
            left: 0;                    /* 左对齐 */
            top: -7px;                  /* 向上偏移7像素 */
            display: inline;            /* 行内元素 */
            color: #00c3ff;             /* 青色 */
        }

        /* ========== 可拖动的延长斜线 ========== */
        /* 斜线元素：可拖动以切换"你"/"我"字 */
        .extended-slash {
            position: relative;         /* 相对定位 */
            display: inline-block;      /* 行内块元素 */
            width: 8px;                 /* 宽度8像素 */
            height: 28px;               /* 高度28像素 */
            margin: 0 -2px;             /* 负边距，紧凑排列 */
            cursor: grab;               /* 抓取光标 */
            user-select: none;          /* 禁止文字选择 */
            vertical-align: baseline;   /* 基线对齐 */
            top: 27px;                  /* 向下偏移27像素 */
        }

        /* 拖动中的斜线 */
        .extended-slash.dragging {
            cursor: grabbing;           /* 抓取中光标 */
        }

        /* 斜线的视觉表现（虚线效果） */
        .extended-slash::before {
            content: '';                            /* 创建伪元素 */
            position: absolute;                     /* 绝对定位 */
            left: 50%;                              /* 水平居中 */
            top: -40px;                             /* 向上偏移 */
            width: 6px;                             /* 宽度6像素 */
            height: 60px;                           /* 高度60像素 */
            border-left: 1px solid #05b8ee;         /* 左边框 */
            border-right: 1px solid #05b8ee;        /* 右边框 */
            border-image: linear-gradient(180deg,   /* 虚线效果（使用渐变） */
                #05b8ee 0%,
                #05b8ee 20%,
                transparent 20%,
                transparent 25%,
                #05b8ee 25%,
                #05b8ee 50%,
                transparent 50%,
                transparent 55%,
                #05b8ee 55%,
                #05b8ee 75%,
                transparent 75%,
                transparent 80%,
                #05b8ee 80%,
                #05b8ee 100%) 1;
            transform: translateX(-50%) skewX(-22deg); /* 居中并倾斜22度 */
            pointer-events: none;                   /* 不响应鼠标事件 */
        }

        /* 斜线的可交互区域（扩大点击范围） */
        .extended-slash::after {
            content: '';                    /* 创建伪元素 */
            position: absolute;             /* 绝对定位 */
            left: 50%;                      /* 水平居中 */
            top: -40px;                     /* 向上偏移 */
            width: 20px;                    /* 宽度20像素（比视觉宽度大） */
            height: 60px;                   /* 高度60像素 */
            transform: translateX(-50%);    /* 居中 */
            cursor: grab;                   /* 抓取光标 */
        }

        /* 拖动中的可交互区域 */
        .extended-slash.dragging::after {
            cursor: grabbing;               /* 抓取中光标 */
        }

        /* 斜线悬停效果 */
        .extended-slash:hover::before {
            border-image: linear-gradient(180deg,   /* 悬停时变为亮青色 */
                #17ffcd 0%,
                #17ffcd 20%,
                transparent 20%,
                transparent 25%,
                #17ffcd 25%,
                #17ffcd 50%,
                transparent 50%,
                transparent 55%,
                #17ffcd 55%,
                #17ffcd 75%,
                transparent 75%,
                transparent 80%,
                #17ffcd 80%,
                #17ffcd 100%) 1;
            box-shadow: 0 0 3px rgba(23, 255, 205, 0.3); /* 发光效果 */
        }

        /* ========== 响应式：小屏幕 ========== */
        @media (max-width: 768px) {
            .profile-text {
                letter-spacing: 1px;            /* 减小字符间距 */
                transform: translateX(-10px);   /* 向左移动 */
            }
            .profile {
                flex-direction: column;         /* 纵向排列 */
                align-items: flex-start;        /* 左对齐 */
            }
        }
    </style>
</head>
<body>
    <!-- ========== HUD装饰层 ========== -->
    <!-- 固定在屏幕四角和中央的科幻风格装饰元素 -->
    <div class="hud-decorations">
        <!-- 四个角落的HUD框架 -->
        <div class="hud-corner hud-corner-tl"></div>  <!-- 左上角 -->
        <div class="hud-corner hud-corner-tr"></div>  <!-- 右上角 -->
        <div class="hud-corner hud-corner-bl"></div>  <!-- 左下角 -->
        <div class="hud-corner hud-corner-br"></div>  <!-- 右下角 -->
        
        <!-- 水平电路连接线 -->
        <div class="circuit-line circuit-line-1"></div>  <!-- 左侧电路线 -->
        <div class="circuit-line circuit-line-2"></div>  <!-- 右侧电路线 -->
        
        <!-- 中央技术状态标签 -->
        <div class="tech-label">INTERFACE_ACTIVE</div>
        
        <!-- 装饰性UI框架 -->
        <div class="ui-frame ui-frame-1"></div>  <!-- 左侧UI框架 -->
        <div class="ui-frame ui-frame-2"></div>  <!-- 右侧UI框架 -->
    </div>

    <!-- ========== 左侧装饰面板 ========== -->
    <!-- 固定在左侧的大型科幻风格装饰框 -->
    <div class="left-panel">
        <!-- 右下角装饰 -->
        <div class="left-panel-corner-br"></div>
        <!-- 内部装饰线条 -->
        <div class="left-panel-line left-panel-line-h1"></div>  <!-- 上方水平线 -->
        <div class="left-panel-line left-panel-line-h2"></div>  <!-- 下方水平线 -->
        <div class="left-panel-line left-panel-line-v1"></div>  <!-- 中间垂直线 -->
        <!-- 发光装饰点 -->
        <div class="left-panel-dot left-panel-dot-1"></div>  <!-- 上方装饰点 -->
        <div class="left-panel-dot left-panel-dot-2"></div>  <!-- 下方装饰点 -->
    </div>

    <!-- ========== 主内容容器 ========== -->
    <div class="container">
        <!-- 竖直分割线：分隔左右区域 -->
        <div class="divider-line" id="dividerLine"></div>
        
        <!-- ========== 左侧内容区域 ========== -->
        <div class="left-section">
            <!-- 个人信息卡片 -->
            <div class="profile">
                <!-- 头像区域 -->
                <div class="profile-img-wrapper">
                    <!-- 头像图片 -->
                    <img src="F_LaiY.png" alt="LaiY">
                    <!-- SVG装饰折线：左上角 -->
                    <svg class="corner-line corner-line-tl" viewBox="0 0 120 120">
                        <polyline points="0,60 0,0 60,0" stroke="red" stroke-width="2" fill="none"/>
                    </svg>
                    <!-- SVG装饰折线：右下角 -->
                    <svg class="corner-line corner-line-br" viewBox="0 0 120 120">
                        <polyline points="60,120 120,120 120,60" stroke="red" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <!-- 文字信息区域 -->
                <div class="profile-text">
                    <!-- 名字（会被JS拆分为单个字符） -->
                    <span class="profile-name" id="nameText">Rr_LaiY</span>
                    <!-- 个人描述 -->
                    <span class="profile-desc">我喜欢你！</span>
                </div>
            </div>
        </div>
        
        <!-- ========== 右侧内容区域 ========== -->
        <div class="right-section">
            <!-- 主标题 -->
            <h1 id="titleH1">
                <!-- 字符切换容器："你"/"我"字切换效果 -->
                <span class="char-switch" id="charContainer">
                    <span class="char-you">你</span>  <!-- "你"字 -->
                    <span class="char-me">我</span>   <!-- "我"字（叠加显示） -->
                </span>
                <!-- 可拖动的斜线元素 -->
                <i class="extended-slash" id="slashElement"></i>想了解_
            </h1>
        </div>
    </div>

    <script>
    // ========================================
    // 功能1：文字拆分为单个字符
    // ========================================
    // 将名字文字拆分为单个span元素，以便实现单字符悬停效果
    function splitTextToSpans() {
        // 获取名字元素
        const nameText = document.getElementById('nameText');
        if (!nameText) return;  // 如果元素不存在，直接返回
        
        // 获取原始文字内容
        const text = nameText.textContent;
        // 清空原有内容
        nameText.innerHTML = '';
        
        // 遍历每个字符，包装在span标签中
        for (let i = 0; i < text.length; i++) {
            const span = document.createElement('span');  // 创建span元素
            span.textContent = text[i];                   // 设置字符内容
            nameText.appendChild(span);                   // 添加到容器中
        }
    }
    
    // 页面加载时立即执行文字拆分
    splitTextToSpans();
    
    // ========================================
    // 功能2：响应式分割线定位
    // ========================================
    // 根据窗口大小和元素位置动态调整分割线位置，保持布局平衡
    function updateDividerPosition() {
        // 获取所有需要的DOM元素
        const container = document.querySelector('.container');      // 主容器
        const h1 = document.getElementById('titleH1');               // 标题元素
        const divider = document.getElementById('dividerLine');      // 分割线
        const leftSection = document.querySelector('.left-section'); // 左侧区域
        
        // 如果任何元素不存在，直接返回（防止错误）
        if (!container || !h1 || !divider || !leftSection) return;
        
        // 获取各元素的位置和尺寸信息
        const containerRect = container.getBoundingClientRect();  // 容器的位置信息
        const h1Rect = h1.getBoundingClientRect();                // 标题的位置信息
        const leftRect = leftSection.getBoundingClientRect();     // 左侧区域的位置信息
        
        // 计算关键位置参数
        const h1LeftRelative = h1Rect.left - containerRect.left;     // h1左边缘相对于容器的位置
        const rightMargin = containerRect.right - h1Rect.right;      // h1右侧到容器右边缘的距离
        const containerWidth = containerRect.width;                   // 容器宽度
        const isSmallPage = containerWidth < 800;                     // 判断是否为小屏幕
        const leftSectionRight = leftRect.right - containerRect.left; // 左侧区域右边缘相对于容器的位置
        const dividerGap = 40;                                        // 分割线与h1的固定间距
        
        // 计算分割线的理想位置：h1左侧 - 40px
        let dividerLeft = h1LeftRelative - dividerGap;
        
        // 限制条件：分割线最左不能超过左侧区域右边缘
        if (dividerLeft < leftSectionRight) {
            dividerLeft = leftSectionRight;
        }
        
        // 计算h1的调整量，让h1在大屏幕时保持居中
        let h1Adjustment = 0;
        const actualLeftGap = h1LeftRelative - dividerLeft;  // h1左侧与分割线的实际距离
        
        // 大屏幕时调整h1位置，使其左右间距平衡
        if (!isSmallPage) {
            const targetAdjustment = actualLeftGap - rightMargin;  // 计算需要调整的量
            h1Adjustment = Math.max(0, targetAdjustment);          // 只向右调整，不向左
        }
        
        // 应用计算结果到DOM元素
        h1.style.right = h1Adjustment + 'px';        // 应用h1位置调整
        divider.style.left = dividerLeft + 'px';     // 应用分割线位置
    }
    
    // 页面加载时初始化分割线位置
    updateDividerPosition();
    // 窗口大小改变时重新计算分割线位置
    window.addEventListener('resize', updateDividerPosition);
    
    // ========================================
    // 功能3：斜线拖动交互
    // ========================================
    // 实现拖动斜线切换"你"/"我"字的交互效果
    (function() {
        // 获取相关DOM元素
        const slashElement = document.getElementById('slashElement');     // 斜线元素
        const charContainer = document.getElementById('charContainer');   // 字符容器
        const charYou = charContainer.querySelector('.char-you');         // "你"字元素
        const charMe = charContainer.querySelector('.char-me');           // "我"字元素
        
        // 拖动状态变量
        let isDragging = false;      // 是否正在拖动
        let startX = 0;               // 拖动起始X坐标
        let currentX = 0;             // 当前X偏移量
        const maxDrag = 40;           // 最大拖动距离（像素）
        
        // ========== 核心函数：更新斜线位置和字符显示 ==========
        function updateSlashPosition(dragDistance) {
            // 限制拖动距离在0到maxDrag之间
            const clampedDistance = Math.max(0, Math.min(maxDrag, dragDistance));
            
            // 移动斜线元素（向左移动，额外偏移4px以对齐）
            slashElement.style.transform = `translateX(${-(clampedDistance + 4)}px)`;
            
            // 计算斜线在字符上的位置百分比
            const charWidth = 28;                                          // 字符宽度
            const slashOffsetPercent = (clampedDistance / charWidth) * 100; // 转换为百分比
            const angleOffset = 45;                                         // 斜线角度偏移
            
            // ===== 更新"我"字的裁剪路径 =====
            // "我"字从斜线右侧逐渐显现
            const startOffsetMe = 60;                                      // 初始偏移
            const rightEdgeTop = 100 - slashOffsetPercent + startOffsetMe; // 顶部右边缘位置
            const rightEdgeBottom = Math.max(0, rightEdgeTop - angleOffset); // 底部右边缘位置
            
            // 使用polygon裁剪路径创建斜线遮罩效果
            charMe.style.clipPath = `polygon(
                ${rightEdgeTop}% 0,
                100% 0,
                100% 100%,
                ${rightEdgeBottom}% 100%
            )`;
            
            // ===== 更新"你"字的裁剪路径 =====
            // "你"字从斜线右侧逐渐隐去
            const offsetStart = -30;                                       // 初始偏移
            let rightClipTop = 100 - slashOffsetPercent - offsetStart;     // 顶部右边缘位置
            if (rightClipTop < 0) rightClipTop = 0;                        // 限制最小值
            const rightClipBottom = Math.max(0, rightClipTop - angleOffset); // 底部右边缘位置

            // 使用polygon裁剪路径创建斜线遮罩效果
            charYou.style.clipPath = `polygon(
                0 0,
                ${rightClipTop}% 0,
                ${rightClipBottom}% 100%,
                0 100%
            )`;
        }
        
        // ========== Pointer事件处理（统一鼠标和触摸） ==========
        function handlePointerDown(e) {
            isDragging = true;
            startX = e.clientX - currentX;
            slashElement.classList.add('dragging');
            slashElement.setPointerCapture(e.pointerId);
            e.preventDefault();
        }
        
        function handlePointerMove(e) {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            currentX = Math.max(-maxDrag, Math.min(0, deltaX));
            updateSlashPosition(-currentX);
        }
        
        function handlePointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            slashElement.classList.remove('dragging');
        }
        
        // ========== 绑定事件监听器 ==========
        slashElement.addEventListener('pointerdown', handlePointerDown);
        document.addEventListener('pointermove', handlePointerMove);
        document.addEventListener('pointerup', handlePointerUp);
        
        // 初始化斜线位置（设置为初始状态）
        updateSlashPosition(0);
    })();
    </script>
</body>
</html>
